<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ティーの高さによる代表的な失敗を示す図解">
  <defs>
    <linearGradient id="bgErr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <linearGradient id="grassErr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <radialGradient id="ballErr" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgErr)"/>

  <g font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">
    <rect x="40" y="30" width="1120" height="100" rx="14" fill="#c62828"/>
    <text x="600" y="78" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">ドライバーで多い「高さ」によるミス</text>
    <text x="600" y="108" text-anchor="middle" font-size="18" font-weight="500" fill="#ffcdd2">高すぎ → テンプラ／低すぎ → ライナー＆チョロ</text>
  </g>

  <!-- LEFT: テンプラ -->
  <g transform="translate(60,170)">
    <rect width="540" height="380" rx="16" fill="#ffffff" stroke="#c62828" stroke-width="3"/>
    <rect width="540" height="50" rx="16" fill="#c62828"/>
    <text x="270" y="34" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="22" font-weight="800" fill="#ffffff">高すぎる ✗ テンプラ</text>

    <!-- Ground -->
    <rect x="20" y="320" width="500" height="50" fill="url(#grassErr)"/>
    <line x1="20" y1="320" x2="520" y2="320" stroke="#33691e" stroke-width="2"/>

    <!-- TEE (very high) -->
    <rect x="120" y="220" width="6" height="100" fill="#e65100"/>
    <ellipse cx="123" cy="220" rx="14" ry="4" fill="#ffb74d"/>
    <circle cx="123" cy="208" r="14" fill="url(#ballErr)" stroke="#9e9e9e" stroke-width="1"/>

    <!-- Driver head -->
    <g transform="translate(60,210)">
      <ellipse cx="0" cy="0" rx="40" ry="16" fill="#37474f" stroke="#212121" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DR</text>
    </g>
    <!-- Hit on top -->
    <text x="123" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#c62828">↓ 上に当たる</text>

    <!-- Trajectory: high pop-up -->
    <path d="M 200 220 Q 250 80 380 200" fill="none" stroke="#c62828" stroke-width="4" stroke-dasharray="6 6"/>
    <text x="295" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#c62828">真上に高く上がるだけ</text>

    <!-- Reason -->
    <rect x="20" y="370" width="500" height="0" fill="none"/>
    <text x="40" y="410" font-size="14" font-weight="800" fill="#c62828">原因：</text>
    <text x="100" y="410" font-size="14" fill="#3e2723">ボールがフェース上端より高すぎ</text>
    <text x="40" y="440" font-size="14" font-weight="800" fill="#1b5e20">対策：</text>
    <text x="100" y="440" font-size="14" fill="#3e2723">ボール半分が出る程度に下げる</text>
  </g>

  <!-- RIGHT: チョロ -->
  <g transform="translate(640,170)">
    <rect width="500" height="380" rx="16" fill="#ffffff" stroke="#c62828" stroke-width="3"/>
    <rect width="500" height="50" rx="16" fill="#c62828"/>
    <text x="250" y="34" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="22" font-weight="800" fill="#ffffff">低すぎる ✗ チョロ・ライナー</text>

    <!-- Ground -->
    <rect x="20" y="320" width="460" height="50" fill="url(#grassErr)"/>
    <line x1="20" y1="320" x2="480" y2="320" stroke="#33691e" stroke-width="2"/>

    <!-- TEE (very low) -->
    <rect x="118" y="295" width="4" height="25" fill="#e65100"/>
    <ellipse cx="120" cy="295" rx="9" ry="3" fill="#ffb74d"/>
    <circle cx="120" cy="285" r="13" fill="url(#ballErr)" stroke="#9e9e9e" stroke-width="1"/>

    <!-- Driver head -->
    <g transform="translate(60,300)">
      <ellipse cx="0" cy="0" rx="40" ry="16" fill="#37474f" stroke="#212121" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DR</text>
    </g>
    <text x="120" y="265" text-anchor="middle" font-size="22" font-weight="800" fill="#c62828">↓ 下に当たる</text>

    <!-- Trajectory: low liner / chol -->
    <path d="M 180 295 Q 240 280 460 305" fill="none" stroke="#c62828" stroke-width="4" stroke-dasharray="6 6"/>
    <text x="320" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#c62828">転がるだけで飛ばない</text>

    <!-- Reason -->
    <text x="40" y="410" font-size="14" font-weight="800" fill="#c62828">原因：</text>
    <text x="100" y="410" font-size="14" fill="#3e2723">フェース下に当たり打ち出しが低い</text>
    <text x="40" y="440" font-size="14" font-weight="800" fill="#1b5e20">対策：</text>
    <text x="100" y="440" font-size="14" fill="#3e2723">「思ってるより1段高め」を意識</text>
  </g>

  <!-- Bottom -->
  <g font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">
    <rect x="40" y="570" width="1120" height="50" rx="12" fill="#1b5e20"/>
    <text x="600" y="603" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">毎回同じ高さに刺せる「段付きティー」が一番のおすすめ</text>
  </g>
</svg>
