<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ブラシティーの仕組みと特徴を示す図解">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="grassB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <radialGradient id="ballB" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </radialGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bgB)"/>

  <!-- Title bar -->
  <g font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">
    <rect x="40" y="30" width="1120" height="100" rx="14" fill="#1565c0"/>
    <text x="600" y="78" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">ブラシティー｜ボールが「ブラシ」に乗る特殊ティー</text>
    <text x="600" y="108" text-anchor="middle" font-size="18" font-weight="500" fill="#bbdefb">フェースとの接触が少なく、抵抗が減る → 飛距離アップ</text>
  </g>

  <!-- Left: 通常ティー -->
  <g transform="translate(120,180)">
    <rect width="380" height="380" rx="16" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/>
    <rect width="380" height="50" rx="16" fill="#90a4ae"/>
    <text x="190" y="34" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="22" font-weight="800" fill="#ffffff">通常ティー</text>

    <!-- Ground -->
    <rect x="20" y="320" width="340" height="50" fill="url(#grassB)"/>
    <line x1="20" y1="320" x2="360" y2="320" stroke="#33691e" stroke-width="2"/>

    <!-- Tee shaft -->
    <rect x="186" y="200" width="8" height="120" fill="#bf360c"/>
    <!-- Tee cup -->
    <ellipse cx="190" cy="200" rx="22" ry="6" fill="#ffb74d"/>
    <path d="M 168,200 Q 168,210 174,210 L 206,210 Q 212,210 212,200 Z" fill="#ffb74d"/>

    <!-- Ball -->
    <circle cx="190" cy="180" r="22" fill="url(#ballB)" stroke="#9e9e9e" stroke-width="1"/>

    <!-- Caption -->
    <text x="190" y="100" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="16" font-weight="600" fill="#37474f">プラスチック or 木製の</text>
    <text x="190" y="125" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="16" font-weight="600" fill="#37474f">「カップ」にボールが乗る</text>
  </g>

  <!-- Right: ブラシティー -->
  <g transform="translate(700,180)">
    <rect width="380" height="380" rx="16" fill="#ffffff" stroke="#1565c0" stroke-width="3"/>
    <rect width="380" height="50" rx="16" fill="#1565c0"/>
    <text x="190" y="34" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="22" font-weight="800" fill="#ffffff">ブラシティー</text>

    <!-- Ground -->
    <rect x="20" y="320" width="340" height="50" fill="url(#grassB)"/>
    <line x1="20" y1="320" x2="360" y2="320" stroke="#33691e" stroke-width="2"/>

    <!-- Tee shaft -->
    <rect x="186" y="220" width="8" height="100" fill="#1976d2"/>

    <!-- Brush bristles (top) -->
    <g>
      <rect x="160" y="200" width="60" height="20" fill="#ffe082" rx="3"/>
      <!-- bristle lines spreading upward -->
      <line x1="160" y1="200" x2="148" y2="170" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="166" y1="200" x2="158" y2="166" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="172" y1="200" x2="170" y2="162" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="178" y1="200" x2="180" y2="160" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="184" y1="200" x2="186" y2="158" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="190" y1="200" x2="190" y2="156" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="196" y1="200" x2="196" y2="158" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="202" y1="200" x2="204" y2="160" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="208" y1="200" x2="212" y2="162" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="214" y1="200" x2="220" y2="166" stroke="url(#bristle)" stroke-width="2.2"/>
      <line x1="220" y1="200" x2="232" y2="170" stroke="url(#bristle)" stroke-width="2.2"/>
    </g>

    <!-- Ball sitting on bristles -->
    <circle cx="190" cy="160" r="22" fill="url(#ballB)" stroke="#9e9e9e" stroke-width="1"/>

    <!-- Annotation lines -->
    <g font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">
      <line x1="240" y1="170" x2="290" y2="125" stroke="#1565c0" stroke-width="2"/>
      <text x="295" y="120" font-size="14" font-weight="700" fill="#1565c0">細い毛先</text>
      <text x="295" y="140" font-size="14" fill="#1565c0">で支える</text>
    </g>

    <!-- Caption -->
    <text x="190" y="100" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="16" font-weight="600" fill="#1565c0">先端が「毛先（ブラシ）」になっており</text>
    <text x="190" y="125" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="16" font-weight="600" fill="#1565c0">ボールへの接触面が少ない</text>
  </g>

  <!-- Bottom benefit bar -->
  <g font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">
    <rect x="40" y="588" width="540" height="32" rx="8" fill="#1565c0"/>
    <text x="310" y="612" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">メリット：抵抗減・飛距離アップ・スピン安定</text>

    <rect x="620" y="588" width="540" height="32" rx="8" fill="#bf360c"/>
    <text x="890" y="612" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">デメリット：価格が高め・規定で禁止の試合あり</text>
  </g>
</svg>
